<h1>LEDパネル</h1>
<p class="lead">SDカードに入れたドット絵のデータを、アニメーションで表示できるLEDパネルです。</p>

<h2>データを入れれば、何でも表示できます</h2>
<p>16×16のフルカラーLEDマトリックスに、Seeed XIAO ESP32-C3を組み合わせました。SDカードに入れた任意のドットデータを読み込んで、アニメーションとして表示します。データを入れ替えれば、表示する内容は自由です。</p>
