<h1>スライムフラッシュ</h1>
<p class="lead">傘の柄に付ける、スライム型のライトです。退社する頃に点滅して、傘立ての中で自分の傘を教えてくれます。</p>

<h2>「あれ、俺の傘どれだっけ？」を解決します</h2>
<p>朝、出勤して傘を置くときにスイッチをON。すると8時間後、ちょうど退社する頃にスライムが点滅を始めます。傘立てに傘がいっぱいあっても、光っているのが自分の傘です。</p>
