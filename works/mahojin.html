<span class="year">2019</span>
<h1>魔法陣</h1>
<p class="lead">六芒星の頂点にLEDろうそくをセットしていくと、魔法陣が光り出す装置です。2019年5月のMaker Faireに出展しました。</p>

<h2>儀式を完成させる楽しさ</h2>
<p>黒い盤の上に、透明な導光チューブで円と六芒星を描いています。頂点の6か所にLEDろうそくを1本ずつ差し込んでいくとろうそくが点灯し、最後の1本が入ったところで魔法陣全体が青く光り出します。</p>
